name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: PYTHONPATH=. pytest tests/

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Open Policy Agent (OPA)
        run: |
          mkdir -p bin
          curl -sL -o bin/opa https://openpolicyagent.org/downloads/v0.61.0/opa_linux_amd64_static
          chmod +x bin/opa
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Run Multi-Engine Scan & OPA Policy Evaluation
        run: |
          export OFFLINE_MODE=true
          python audit.py
        # The audit.py script evaluates policies using OPA and exits non-zero if violations exist
