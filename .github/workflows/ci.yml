name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: PYTHONPATH=. pytest tests/

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Open Policy Agent (OPA)
        run: |
          mkdir -p bin
          curl -sL -o bin/opa https://openpolicyagent.org/downloads/v0.61.0/opa_linux_amd64_static
          chmod +x bin/opa
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Install Scanner Engines
        run: |
          mkdir -p bin
          # Install Trivy
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b bin v0.50.1
          # Install Dockle
          curl -L -o dockle.tar.gz https://github.com/goodwithtech/dockle/releases/download/v0.4.14/dockle_0.4.14_Linux-64bit.tar.gz
          tar zxvf dockle.tar.gz -C bin dockle && rm dockle.tar.gz
          # Install Syft
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b bin v1.3.0
          # Install Grype
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b bin v0.77.1
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Verify Scanner Engines
        run: |
          trivy --version
          dockle --version
          syft --version
          grype --version

      - name: Run Multi-Engine Scan & OPA Policy Evaluation
        run: |
          export OFFLINE_MODE=true
          python audit.py
        # The audit.py script evaluates policies using OPA and exits non-zero if violations exist
