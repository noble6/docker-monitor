version: '3.8'

services:
  # Vulnerable Flask Application
  flask-vulnerable:
    build:
      context: .
      dockerfile: Dockerfile.vuln
    image: flask-app-vulnerable:latest
    container_name: flask-vulnerable
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - API_KEY=super-secret-key  # ❌ Hardcoded secret
    # ❌ Running as root (default)
    # ❌ No resource limits
    # ❌ No health checks
    networks:
      - app-network

  # Hardened Flask Application
  flask-hardened:
    build:
      context: .
      dockerfile: Dockerfile.hardened
    image: flask-app-hardened:latest
    container_name: flask-hardened
    ports:
      - "5002:5000"
    environment:
      - FLASK_ENV=production
    # ✅ Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    # ✅ Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # ✅ Read-only filesystem (except tmp)
    read_only: true
    tmpfs:
      - /tmp
    # ✅ Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-network

  # Security Dashboard
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: security-dashboard:latest
    container_name: security-dashboard
    user: "0:0"  # Required for Docker socket access (control panel actions)
    ports:
      - "8080:8080"
    volumes:
      - reports_data:/app/reports
      - runtime_data:/app/runtime
      - logs_data:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=production
      - PROJECT_ROOT=/app
      - DASHBOARD_AUTH_USER=${DASHBOARD_AUTH_USER:-admin}
      - DASHBOARD_AUTH_PASSWORD=${DASHBOARD_AUTH_PASSWORD:-password}
      - SECRET_KEY=${SECRET_KEY:-thisisasupersecretkey}
    depends_on:
      - flask-vulnerable
      - flask-hardened
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  reports_data:
  runtime_data:
  logs_data:
