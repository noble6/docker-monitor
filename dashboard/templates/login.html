<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CyberSec Control Center</title>
  <style>
    :root {
      --bg: #070b14;
      --bg-soft: #0d1422;
      --surface: rgba(13, 20, 34, 0.75);
      --surface-2: rgba(15, 24, 40, 0.8);
      --text: #dce8ff;
      --muted: #8ea3c7;
      --line: rgba(86, 121, 175, 0.35);
      --accent: #15e4ff;
      --accent-2: #7b61ff;
      --good: #35f3a0;
      --warn: #ffb020;
      --bad: #ff5d7f;
      --glow: 0 0 30px rgba(21, 228, 255, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% -10%, rgba(21, 228, 255, 0.16), transparent 30%),
        radial-gradient(circle at 90% 0%, rgba(123, 97, 255, 0.22), transparent 30%),
        linear-gradient(180deg, var(--bg-soft), var(--bg));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(86, 121, 175, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(86, 121, 175, 0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--glow);
      backdrop-filter: blur(14px);
    }

    .login-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-title h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: 0.4px;
    }

    .login-title p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all .2s ease;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(21, 228, 255, 0.1);
    }

    .btn-filled {
      width: 100%;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(123,97,255,0.42), rgba(21,228,255,0.3));
      color: var(--text);
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 650;
      font-size: 1rem;
      transition: all .2s ease;
      margin-top: 10px;
    }

    .btn-filled:hover {
      transform: translateY(-1px);
      box-shadow: var(--glow);
    }

    .error {
      background: rgba(255, 93, 127, 0.15);
      color: var(--bad);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 93, 127, 0.3);
      margin-bottom: 20px;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="login-container">
    <div class="login-title">
      <h1>CyberSec Center</h1>
      <p>Authentication Required</p>
    </div>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required />
      </div>
      <button type="submit" class="btn-filled">Login</button>
    </form>
  </div>
</body>
</html>
