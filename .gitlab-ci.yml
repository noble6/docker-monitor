# GitLab CI/CD Pipeline for Container Security Audit

stages:
  - build
  - test
  - scan

variables:
  DOCKER_DRIVER: overlay2
  SECURE_FILES_DOWNLOAD_PATH: '.'

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -f Dockerfile.vuln -t vulnerable-image:latest .
    - docker build -f Dockerfile.hardened -t hardened-image:latest .
  tags:
    - docker

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt pytest
    - PYTHONPATH=. pytest tests/

scan:
  stage: scan
  image: python:3.11-slim
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apt-get update && apt-get install -y curl docker.io tar
    - curl -sL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v0.61.0/opa_linux_amd64_static
    - chmod +x /usr/local/bin/opa
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.50.1
    - curl -L -o dockle.tar.gz https://github.com/goodwithtech/dockle/releases/download/v0.4.14/dockle_0.4.14_Linux-64bit.tar.gz
    - tar zxvf dockle.tar.gz -C /usr/local/bin dockle && rm dockle.tar.gz
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.3.0
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.77.1
    - trivy --version
    - dockle --version
    - syft --version
    - grype --version
    - pip install -r requirements.txt
  script:
    - export OFFLINE_MODE=true
    - python audit.py
    # This evaluates policies using OPA and exits non-zero if violations exist
