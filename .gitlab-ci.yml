# GitLab CI/CD Pipeline for Container Security Audit

stages:
  - build
  - test
  - scan

variables:
  DOCKER_DRIVER: overlay2
  SECURE_FILES_DOWNLOAD_PATH: '.'

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -f Dockerfile.vuln -t vulnerable-image:latest .
    - docker build -f Dockerfile.hardened -t hardened-image:latest .
  tags:
    - docker

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt pytest
    - PYTHONPATH=. pytest tests/

scan:
  stage: scan
  image: python:3.11-slim
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apt-get update && apt-get install -y curl docker.io
    - curl -sL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v0.61.0/opa_linux_amd64_static
    - chmod +x /usr/local/bin/opa
    - pip install -r requirements.txt
  script:
    - export OFFLINE_MODE=true
    - python audit.py
    # This evaluates policies using OPA and exits non-zero if violations exist
